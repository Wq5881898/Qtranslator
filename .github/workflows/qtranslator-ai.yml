name: Qtranslator AI

on:
  push:
    branches: ['dev/further-development']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate companion extension
        run: |
          npm ci
          npm run check
          npm run build
          npm run verify:release
      - name: Validate desktop and AI protocols
        run: |
          dotnet build desktop/Translator.Stage2.slnx --configuration Release --configfile NuGet.Config
          dotnet run --project desktop/Translator.TechnicalValidation --configuration Release --no-build
          dotnet run --project desktop/Translator.TechnicalValidation --configuration Release --no-build -- --chat
          dotnet run --project desktop/Translator.TechnicalValidation --configuration Release --no-build -- --chat-render artifacts/ai-preview
      - name: Publish portable Windows package
        run: |
          dotnet publish desktop/Translator.Desktop --configuration Release --runtime win-x64 --self-contained true --output staging/desktop --configfile NuGet.Config
          dotnet publish desktop/Translator.BridgeHost --configuration Release --runtime win-x64 --self-contained true --output staging/bridge-host --configfile NuGet.Config
          Copy-Item .output/chrome-mv3 staging/extension -Recurse
          Copy-Item docs/QTRANSLATOR_AI_ZH.md staging/README_ZH.md
      - uses: actions/upload-artifact@v4
        with:
          name: Qtranslator-v1.2.0-win-x64
          path: staging
      - uses: actions/upload-artifact@v4
        with:
          name: Qtranslator-AI-preview
          path: artifacts/ai-preview
